name: Python Pytest CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  testing:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Show Files
        run: |
          pwd
          ls -la
          echo "----- test_app.py -----"
          cat test_app.py

      - name: Check Pytest Collection
        run: |
          python -m pytest --collect-only -v

      - name: Run Tests
        run: |
          python -m pytest test_app.py -v
